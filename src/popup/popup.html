<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golden Hour Finder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1 id="place">Golden Hour Finder</h1>
        <p id="meta" class="muted">Finding your location…</p>
      </div>
      <img class="logo" src="../icons/icon48.png" alt="Golden Hour Finder" />
    </header>

    <section id="status" class="status" aria-live="polite" hidden>
      <div id="status-title" class="status-title"></div>
      <div id="status-detail" class="status-detail"></div>
    </section>

    <nav class="day-nav" aria-label="Choose a day">
      <button id="previous-day" class="day-arrow" type="button" aria-label="Previous day">←</button>
      <time id="selected-date" datetime=""></time>
      <button id="next-day" class="day-arrow" type="button" aria-label="Next day">→</button>
    </nav>

    <section id="timeline-wrap" hidden>
      <div class="timeline" id="timeline" role="img" aria-label="Light phases across the day"></div>
      <div id="timeline-ticks" class="ticks"></div>
    </section>

    <ul id="times" class="times" hidden></ul>

    <p id="error" class="error" role="alert" hidden></p>

    <script src="popup.js"></script>
  </body>
</html>
